name: CI

on:
  push:
    paths:
      - 'features/ai/github-app/**'
  pull_request:
    paths:
      - 'features/ai/github-app/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: features/ai/github-app/package-lock.json

      - name: Install dependencies
        working-directory: features/ai/github-app
        run: npm ci

      - name: Run tests
        working-directory: features/ai/github-app
        run: npm test
